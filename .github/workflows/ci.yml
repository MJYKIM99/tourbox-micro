name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Verify dependency lockfile
        run: git diff --exit-code -- Package.resolved

      - name: Validate package metadata
        run: swift package dump-package > /dev/null

      - name: Check committed whitespace
        run: git show --check --format= HEAD

      - name: Build release configuration
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Check localization integrity
        run: ruby Scripts/check-localizations.rb
