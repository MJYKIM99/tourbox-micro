name: Bug report
description: Report a reproducible TourBox Micro problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach Codex databases, rollout files, prompts, responses, signing files, or TourBox Console databases. Follow SECURITY.md for sensitive reports.
  - type: input
    id: version
    attributes:
      label: TourBox Micro version
      placeholder: 0.8.1 (Build 17)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 14.6
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: TourBox hardware and Console version
      placeholder: TourBox Elite, Console 5.2.6
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Press …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only reviewed, non-sensitive output from --doctor when relevant.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed personal Codex content, local paths, databases, and credentials.
          required: true
